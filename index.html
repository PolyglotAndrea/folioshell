<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>folioshell · andrea@cognix.one</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- animated background -->
  <canvas id="bg-canvas"></canvas>

  <!-- floating glow orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- centered terminal window -->
  <div id="scene">
    <div id="window">

      <!-- title bar -->
      <div id="titlebar">
        <div class="traffic-lights">
          <span class="tl tl-red"  title="close"></span>
          <span class="tl tl-yellow" title="minimize"></span>
          <span class="tl tl-green"  title="maximize"></span>
        </div>
        <span id="tab-title">andrea@cognix.one — zsh</span>
        <div class="titlebar-right">folioshell</div>
      </div>

      <!-- terminal body -->
      <div id="terminal">
        <div id="output"></div>

        <div id="input-line">
          <span class="ps1">
            <span class="ps1-user">andrea</span><span class="ps1-at">@</span><span class="ps1-host">cognix.one</span>
            <span class="ps1-dir"> ~</span>
            <span class="ps1-branch"> git:(main)</span>
            <span class="ps1-arrow"> ❯</span>
          </span>
          <input
            type="text"
            id="cmd-input"
            autofocus
            autocomplete="off"
            spellcheck="false"
            aria-label="terminal input"
          />
          <span id="cursor-block"></span>
        </div>
      </div>

    </div>
  </div>

  <script src="main.js"></script>
  <script src="bg.js"></script>
</body>
</html>
